version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Phaser 3. Phaser 4 is a separate decision.
      - dependency-name: phaser
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet, so its PR would be red.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
